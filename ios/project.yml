# XcodeGen spec. The generated Aloft.xcodeproj, Info.plist, and entitlements
# are not checked in: run `make ios-project`. Every Info.plist key lives here
# (NOOP lost camera purpose strings to a regenerated plist; see AGENTS.md).
name: Aloft
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Connect:
    url: https://github.com/connectrpc/connect-swift
    from: 1.2.0
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: 1.33.3
  AloftStrap:
    path: Packages/AloftStrap
targets:
  Aloft:
    type: application
    platform: iOS
    sources:
      - path: Aloft
        excludes:
          - "Resources/Fonts/licenses/**"
    dependencies:
      - package: Connect
      - package: SwiftProtobuf
      - package: AloftStrap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ALOFT_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(ALOFT_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Aloft/Aloft.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin:
          - Default
    info:
      path: Aloft/Info.plist
      properties:
        CFBundleDisplayName: Aloft
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: Aloft talks to your WHOOP strap over Bluetooth to sync your history to this phone.
        NSHealthShareUsageDescription: Aloft reads your sleep, heart rate, and heart rate variability to show your sky. It stays on this phone.
        NSHealthUpdateUsageDescription: Aloft only reads from Apple Health. It does not write anything to it.
        UIAppFonts:
          - HostGrotesk-Variable.ttf
          - IBMPlexMono-Light.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - Newsreader-Italic-Variable.ttf
        AloftAPIURL: $(ALOFT_API_URL)
        NeonAuthURL: $(NEON_AUTH_URL)
        NeonAuthOrigin: $(NEON_AUTH_ORIGIN)
  AloftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AloftTests
    dependencies:
      - target: Aloft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: invalid.aloft.local.tests
        SWIFT_VERSION: "6.0"
schemes:
  Aloft:
    build:
      targets:
        Aloft: all
        AloftTests: [test]
    test:
      config: Debug
      targets:
        - AloftTests
    run:
      config: Debug
    archive:
      config: Release
